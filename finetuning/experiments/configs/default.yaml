# ==============================================================================
# OpenOrca LoRA Fine-Tuning Configuration: Baseline (V1)
# ==============================================================================

run:
  name: "openorca-lora-v1"
  description: "Standard 3-epoch baseline on curated OpenOrca subset"
  model: "unsloth/gpt-oss-20b-BF16"
  train_data: "openorca_train.jsonl"
  val_data: "openorca_val.jsonl"
  seed: 42

hyperparameters:
  learning_rate: 3.0e-5
  batch_size: 4
  n_epochs: 3
  warmup_ratio: 0.05
  weight_decay: 0.01
  context_length: 4096
  packing: true
  max_grad_norm: 1.0

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
